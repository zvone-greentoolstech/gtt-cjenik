name: Objava cjenika

# Odluka NN 101/2026 traži objavu svakog radnog dana najkasnije do 8:00.
# Cron je u UTC-u. 04:30 UTC = 06:30 ljeti (CEST) i 05:30 zimi (CET),
# dakle najmanje sat i pol zalihe za kašnjenje GitHubova rasporeda.
on:
  schedule:
    - cron: '30 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write   # commit objave u repozitorij (trag u povijesti)
  pages: write      # objava na GitHub Pages
  id-token: write   # deploy-pages traži OIDC token

concurrency:
  group: cjenik
  cancel-in-progress: false

env:
  # Runner je u UTC-u. Bez ovoga bi vrijeme u nazivu arhivirane datoteke
  # bilo UTC, a Odluka traži stvarno vrijeme objave.
  TZ: Europe/Zagreb

jobs:
  pripremi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generiraj cjenik
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/generate-cjenik.mjs

      - name: Commitaj objavu
        run: |
          git config user.name  "cjenik-bot"
          git config user.email "cjenik-bot@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
          else
            git commit -m "Cjenik $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Spremi za objavu
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  objavi:
    needs: pripremi
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - name: Objavi na GitHub Pages
        id: objava
        uses: actions/deploy-pages@v4
